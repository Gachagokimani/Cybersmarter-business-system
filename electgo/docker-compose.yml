Version: '3.8'

services:
  electgo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electgo
    volumes:
      - ./app:/app
      - ./prisma:/app/prisma
      - ./node_modules:/app/node_modules
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db